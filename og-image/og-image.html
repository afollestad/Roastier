<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Roastier link preview</title>
    <!-- Links the site's own sheets without media, so the preview can't drift
         from the dark theme. render.sh screenshots it at 1200x630. -->
    <link rel="stylesheet" href="../styles/index-common.css">
    <link rel="stylesheet" href="../styles/index-dark.css">
    <style>
        html,
        body {
            width: 1200px;
            height: 630px;
            margin: 0;
            overflow: hidden;
        }

        .section-hero {
            height: 630px;
            padding: 0;
            text-align: left;
        }

        /* The glow and steam run to the frame's edges instead of fading out. */
        .hero-sky {
            -webkit-mask-image: none;
            mask-image: none;
        }

        .steam path {
            animation: none;
        }

        .hero-copy {
            position: absolute;
            top: 50%;
            left: 80px;
            width: 520px;
            max-width: none;
            padding: 0;
            transform: translateY(-50%);
        }

        .app-icon {
            width: 150px;
            margin: 0;
        }

        .hero-copy h1 {
            margin-top: 28px;
            font-size: 104px;
        }

        .tagline {
            margin: 16px 0 0;
            font-size: 32px;
            line-height: 1.35;
            text-wrap: balance;
        }

        /* Cut off by the frame's right and bottom edges. */
        .hero-media {
            position: absolute;
            top: 150px;
            left: 640px;
            width: 652px;
            margin: 0;
            padding: 0;
        }

        .popover-shot {
            max-width: none;
            width: 652px;
        }
    </style>
</head>

<body>
    <section class="section-hero">
        <div class="hero-sky" aria-hidden="true">
            <svg class="steam" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMax slice" focusable="false">
                <path d="M170 900 C110 800 230 720 170 620 S110 440 170 340 S230 180 170 80"/>
                <path d="M1030 900 C970 800 1090 720 1030 620 S970 440 1030 340 S1090 180 1030 80"/>
                <path d="M100 960 C40 860 160 780 100 680 S40 500 100 400"/>
            </svg>
        </div>

        <div class="container hero-copy">
            <picture class="app-icon">
                <img src="../images/app-icon-dark.png" alt="" width="256" height="256">
            </picture>
            <h1>Roastier</h1>
            <p class="tagline">Keep your Mac awake from the menu bar.</p>
        </div>

        <div class="hero-media">
            <img class="popover-shot" src="../images/popover-timed-dark.webp" alt="" width="652" height="558">
        </div>
    </section>
</body>

</html>
